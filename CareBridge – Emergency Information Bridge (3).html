:root{--navy:#0B1F33;--red:#E53935;--green:#16A34A;--blue:#1D5FD6;--bg:#F4F8FC;--line:#E2E8F0;--mute:#5B6B7C;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit}html{background:var(--bg)}
body{margin:0;color:var(--navy);font:17px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(900px 500px at 10% 0,rgba(229,57,53,.10),transparent 60%),radial-gradient(900px 600px at 95% 20%,rgba(29,95,214,.12),transparent 60%),var(--bg);min-height:100vh}
a{color:inherit}:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.05em;text-decoration:none}.logo small{display:block;font-size:11px;color:var(--blue);letter-spacing:0;font-weight:600}
.logo svg{animation:lhb 1.6s infinite}@keyframes lhb{0%,100%{transform:scale(1)}12%{transform:scale(1.15)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
.links{display:flex;gap:4px;align-items:center}.links a{text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:600;color:var(--mute);font-size:15px;white-space:nowrap}
.links a.on,.links a:hover{background:#fff;color:var(--navy)}.links a.sosb{background:var(--red);color:#fff;animation:ring 2.2s infinite,fx-shake .8s 1.6s both}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(229,57,53,.55)}70%,100%{box-shadow:0 0 0 14px rgba(229,57,53,0)}}
#bg{display:none}#burger{display:none;min-width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px}
@media(max-width:860px){#burger{display:block}.links{display:none;position:absolute;top:66px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:10px 20px 16px;border-bottom:1px solid var(--line)}.links.open{display:flex}}
main{padding:30px 0 60px}h1,h2,h3{margin:0 0 10px;letter-spacing:-.02em}h2{font-size:clamp(26px,4vw,36px)}.sub{color:var(--mute);font-size:18px;max-width:560px}.small{font-size:14px;color:var(--mute)}
.card{position:relative;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(11,31,51,.05)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:14px;border:2px solid var(--navy);background:var(--navy);color:#fff;font:700 16px 'Plus Jakarta Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(11,31,51,.5)}.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);border-color:var(--red)}.btn.green{background:var(--green);border-color:var(--green)}.btn.ghost{background:#fff;color:var(--navy)}
.btn.red:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:140%}}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{position:relative;border-radius:28px;overflow:hidden;padding:34px;display:grid;grid-template-columns:1.15fr 1fr;gap:24px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(244,248,252,.97) 38%,rgba(244,248,252,.35) 72%,rgba(244,248,252,.1)),var(--photo) 62% 30%/cover}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:22px}}
.badge{display:inline-flex;padding:8px 14px;border:1px solid #BFD3F2;border-radius:12px;background:#fff;font-weight:700;font-size:14px}
.big{font-size:clamp(40px,8vw,82px);font-weight:800;letter-spacing:-.02em;line-height:1;margin:14px 0 8px;white-space:nowrap}
.lt{display:inline-block;animation:ltr .8s cubic-bezier(.2,.9,.3,1.3) both,bob 3.4s ease-in-out infinite}.lt.b{background:linear-gradient(90deg,#1D5FD6,#14B8A6);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes ltr{from{opacity:0;transform:translateY(-50px) rotateX(90deg)}}@keyframes bob{50%{transform:translateY(-5px)}}
.tag{font-size:clamp(20px,3.2vw,30px);font-weight:800;min-height:1.3em;margin:0 0 10px;color:var(--blue)}.caret{display:inline-block;width:3px;height:1em;background:var(--blue);margin-left:3px;vertical-align:-.12em;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:16px}
.act{display:block;text-decoration:none;transition:transform .25s,box-shadow .25s}.act b{display:block;margin-top:6px}.act .e{font-size:30px;display:inline-block}
.c1{background:#EAF2FF}.c2{background:#FFEDEE}.c3{background:#E6F8EE}
.h-tilt:hover{transform:perspective(600px) rotateY(8deg) rotateX(-4deg)}.h-lift:hover{transform:translateY(-8px);box-shadow:0 18px 30px -14px rgba(229,57,53,.5)}.h-glow:hover{box-shadow:0 0 0 4px rgba(22,163,74,.25),0 14px 28px -12px rgba(22,163,74,.6)}
.h-tilt:hover .e{animation:wob .6s}.h-lift:hover .e{animation:hop .5s}.h-glow:hover .e{animation:spin .7s}
@keyframes wob{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}@keyframes hop{50%{transform:translateY(-12px) scale(1.2)}}@keyframes spin{to{transform:rotate(360deg)}}
.mon{background:#07131F;border-radius:22px;padding:16px;color:#fff;box-shadow:0 30px 60px -24px rgba(11,31,51,.6)}

   <ul className="ck">{R.map((x,i)=><A k="slide" t="li" key={x[0]} d={.7+i*.1}>{x[1]?'✅':'⚠️'} {x[0]}{x[1]?'':' missing'}</A>)}</ul></div>
   <a className="btn" href="#/profile" style={{width:'100%',marginTop:12}}>Complete profile</a></A>
  <A k="swing" d={.6} className="card"><h3>In an emergency</h3><p className="small">CareBridge is a prototype. It does not diagnose, treat, or replace professional medical care.</p><a className="btn red" href={tel(NUM)} style={{width:'100%'}}>📞 Call Emergency Services</a></A>
 </div></>}
const keyframesExtra=document.createElement('style');keyframesExtra.textContent='@keyframes ringfill{from{stroke-dasharray:0 var(--c)}}';document.head.appendChild(keyframesExtra);

const FIELDS=[['name','Full name','',1],['age','Age','',0],['blood','Blood group','e.g. O+',0],['allergies','Allergies','e.g. Penicillin',0],['conditions','Medical conditions','',0],['meds','Current medications','',0],['cName','Emergency contact name','',1],['cRel','Relationship','',0],['cPhone','Emergency contact phone','',1]];
function Profile({prof,save}){
 const[f,setF]=useState(prof||{}),[ok,setOk]=useState(false),[err,setErr]=useState(''),n=FIELDS.filter(x=>(f[x[0]]||'').trim()).length;
 const sub=e=>{e.preventDefault();if(!f.name||!f.cName||!f.cPhone)return setErr('Add your name and an emergency contact name and phone.');setErr('');save({...f,id:f.id||'user-'+Date.now().toString(36)});setOk(true)};
 return <><A k="focus" t="h2">My emergency profile</A><A k="blur" t="p" className="sub" d={.2}>Fill in what a responder needs in the first minute.</A>
 <A k="curtain" t="form" d={.3} className="card" style={{marginTop:16}} onSubmit={sub} noValidate>
  <div className="meter"><i style={{width:n/FIELDS.length*100+'%'}}/></div><div className="small" style={{margin:'6px 0 8px'}}>{n} of {FIELDS.length} fields complete</div>
  <div className="cols">{FIELDS.map(([id,l,ph,req],i)=><A key={id} k={FX[i%FX.length]} d={.4+i*.08}><label htmlFor={id}>{l}{req?' *':''}</label><input id={id} value={f[id]||''} placeholder={ph} type={id==='cPhone'?'tel':'text'} onChange={e=>setF({...f,[id]:e.target.value})}/></A>)}</div>
  {err&&<A k="shake" className="note err" role="alert">{err}</A>}
  {ok&&<A k="elastic" className="note ok"><svg width="22" height="22" viewBox="0 0 24 24" style={{verticalAlign:'-5px'}}><path d="M4 12l5 5 11-11" fill="none" stroke="#14532D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="30" style={{animation:'dr2 .6s ease both'}}/></svg> Profile saved. <a href="#/qr"><b>View your QR</b></a></A>}
  <button className="btn red" style={{marginTop:14}} type="submit">Save emergency profile</button></A></>}
const dr=document.createElement('style');dr.textContent='@keyframes dr2{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}';document.head.appendChild(dr);

function QR({prof,load}){
 const box=useRef();useEffect(()=>{if(!prof||!box.current||!window.QRCode)return;box.current.innerHTML='';try{new QRCode(box.current,{text:cardUrl(prof),width:240,height:240,colorDark:'#0B1F33',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.L})}catch(e){box.current.textContent='QR could not be drawn.'}},[prof]);
 if(!prof)return <><A k="focus" t="h2">Emergency QR</A><A k="shake" className="note warn" d={.3}>No profile yet. Create one or load the demo.</A><div className="row"><A k="zoom" t="a" href="#/profile" className="btn" d={.4}>Create profile</A><A k="rise" t="button" className="btn ghost" d={.5} onClick={load}>Use Demo Profile</A></div></>;
 const dl=()=>{const c=box.current.querySelector('canvas');if(!c)return say('Download unavailable');const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='carebridge-qr.png';a.click()};
 return <div style={{textAlign:'center'}}><A k="drop" t="h2">Emergency QR for {prof.name}</A><A k="blur" t="p" className="sub" d={.2} style={{margin:'0 auto'}}>Scan to see emergency details. The scanned page is read-only.</A>
 <A k="spin" d={.4} className="qrbox"><span className="laser"/><div ref={box}/></A>
 <div className="row" style={{justifyContent:'center'}}><A k="slide" t="button" d={.8} className="btn" onClick={dl}>⬇ Download QR</A><A k="rise" t="a" d={1} href={cardUrl(prof)} className="btn red">View emergency card</A></div>
 <A k="wipe" t="p" d={1.2} className="small" style={{marginTop:14}}>The QR carries the details inside it. Use demo data only in this prototype.</A></div>}

const SC=[['Breathing trouble','A woman is struggling to breathe and says she has asthma. She is conscious and her inhaler is in her bag. It started about ten minutes ago.'],['Fall with head injury','A boy fell off his bike two minutes ago, hit his head and is bleeding. He is awake but confused.'],['Seizure','An elderly man is having a seizure right now. His daughter says he has epilepsy and is allergic to penicillin.']];
const STEPS=['Listening','Understanding','Extracting information','Preparing emergency snapshot'];
function Help(){
 const[txt,setTxt]=useState(''),[live,setLive]=useState(false),[err,setErr]=useState(''),[step,setStep]=useState(-1),[r,setR]=useState(null),rec=useRef();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const mic=()=>{if(live&&rec.current)return rec.current.stop();const x=new SR(),base=txt;x.lang='en-US';x.interimResults=true;x.onstart=()=>setLive(true);x.onresult=e=>{let t='';for(const y of e.results)t+=y[0].transcript;setTxt((base?base+' ':'')+t)};x.onerror=()=>setErr('Could not hear you. Check microphone permission or type instead.');x.onend=()=>setLive(false);rec.current=x;try{x.start()}catch(e){setErr('Voice input could not start.')}};
 const gen=async()=>{if(!txt.trim())return setErr('Describe what happened first, by voice or text.');setErr('');if(rec.current&&live)rec.current.stop();for(let i=0;i<STEPS.length;i++){setStep(i);await new Promise(y=>setTimeout(y,550))}setStep(STEPS.length);setR(parseEmergency(txt))};
 if(step>=0&&step<STEPS.length)return <div className="card"><h3>Working…</h3><ul className="steps" aria-live="polite">{STEPS.map((s,i)=><A k="slide" t="li" d={i*.1} key={s} className={i<step?'done':i===step?'on':''}>{s}</A>)}</ul></div>;
 if(r){const L=a=>a.length?a.join(', '):'Unknown',C=[['EVENT',r.event],['TIME',r.time],['CONSCIOUSNESS',r.cons],['OBSERVED',L(r.obs)],['KNOWN CONDITIONS (reported)',L(r.conds)],['MEDICATIONS (reported)',L(r.meds)],['ALLERGIES',L(r.al)]],known=C.filter(x=>x[1]!=='Unknown').length,pct=Math.round(known/C.length*100);
  const T=`EMERGENCY SNAPSHOT (CareBridge)\n${C.map(x=>x[0]+': '+x[1]).join('\n')}\n${r.note}\nNot medical advice.`;
  return <><A k="drop" t="h2">🚨 EMERGENCY SNAPSHOT</A>
  <A k="elastic" d={.15} className="card"><div className="k">INFORMATION CAPTURED</div><div className="v"><Count to={pct} suffix="%"/></div><div className="meter"><i style={{width:pct+'%'}}/></div></A>
  <div className="snap">{C.map((c,i)=><A key={c[0]} k={FX[i%FX.length]} d={.3+i*.12} className="card"><div className="k">{c[0]}</div><div className="v">{c[1]}</div></A>)}</div>
  <A k="glitch" d={1.3} className="imp"><b>⚠️ IMPORTANT</b><div className="v" style={{fontSize:19}}>{r.note}</div></A>
  <div className="row"><A k="zoom" t="a" d={1.5} className="btn red" href={tel(NUM)}>📞 CALL EMERGENCY SERVICES</A><A k="rise" t="button" d={1.6} className="btn" onClick={()=>navigator.clipboard.writeText(T).then(()=>say('Snapshot copied'),()=>say('Copy blocked here'))}>📋 COPY</A><A k="flip" t="a" d={1.7} className="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/hospital+near+me">🏥 NEAREST HOSPITAL</A><A k="slide" t="button" d={1.8} className="btn ghost" onClick={()=>{setR(null);setStep(-1)}}>🔄 START AGAIN</A></div></>}
 return <><A k="focus" t="h2">🚨 I'M HELPING SOMEONE</A><A k="blur" t="p" className="sub" d={.2}>Describe what you observed. CareBridge will organize it into a snapshot.</A>
 <A k="curtain" d={.3} className="card" style={{marginTop:18}}>
  <div style={{textAlign:'center'}}><A k="spin" t="button" d={.5} className={'mic'+(live?' live':'')} onClick={mic} disabled={!SR} aria-label="Voice input" style={!SR?{opacity:.4}:{}}>🎤</A>{live&&<div className="wave">{[...Array(9)].map((_,i)=><i key={i}/>)}</div>}<div className="small" style={{marginTop:8}}>{SR?(live?'Listening… tap to stop':'Tap to speak'):'Voice input not supported here. Please type.'}</div></div>
  <label htmlFor="d">Or type what happened</label><textarea id="d" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Example: A man suddenly collapsed five minutes ago. He is unconscious and his wife says he has diabetes."/>
  {err&&<A k="shake" className="note err" role="alert">{err}</A>}
  <div className="row" style={{marginTop:14}}><button className="btn red" onClick={gen}>GENERATE EMERGENCY SNAPSHOT</button></div>
  <div className="chips">{SC.map(([l,t],i)=><A k={['drop','rise','zoom'][i]} t="button" d={.9+i*.15} key={l} onClick={()=>setTxt(t)}>{l}</A>)}</div></A></>}

function Viewer({id,d}){
 let p=null;try{if(d)p=dec(d)}catch(e){}if(!p)p=id===DEMO.id?DEMO:g('profile',null);if(p&&p.id!==id&&!d)p=null;
 if(!p)return <A k="shake" className="ecard" style={{borderColor:'#E2E8F0'}}><section><div className="v">Profile not found</div><p>This link is invalid. If someone needs help, call {NUM} now.</p><a className="btn red" href={tel(NUM)}>🚑 CALL EMERGENCY SERVICES</a></section></A>;
 const S=[['👤 Patient',p.name+(p.age?', '+p.age:'')],['🩸 Blood group',p.blood],['⚠️ Allergies',p.allergies],['🏥 Conditions',p.conditions],['💊 Medications',p.meds],['📞 Contact',(p.cName||'')+(p.cRel?' ('+p.cRel+')':'')+' '+(p.cPhone||'')]];
 return <A k="flip" className="ecard"><header>🚨 EMERGENCY INFORMATION</header>{S.map(([k,v],i)=><A key={k} k={['slide','rise','glitch','blur','elastic','drop'][i]} t="section" d={.4+i*.15}><div className="k">{k}</div><div className="v">{v||'Not provided'}</div></A>)}
 <div className="acts"><A k="zoom" t="a" d={1.4} className="btn green" href={tel(p.cPhone)}>📞 CALL EMERGENCY CONTACT</A><A k="shake" t="a" d={1.6} className="btn red" href={tel(NUM)}>🚑 CALL EMERGENCY SERVICES</A><div className="small">For emergency assistance. Not medical advice.</div></div></A>}

function SOS({prof,load}){
 const[t0]=useState(Date.now()),[now,setNow]=useState(Date.now()),[notes,setNotes]=useState([[Date.now(),'Emergency Mode activated']]),[nt,setNt]=useState(''),[loc,setLoc]=useState(null);
 useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(i)},[]);
 if(!prof)return <><A k="focus" t="h2">Emergency Mode</A><p className="sub">Add a profile first so responders can see your details.</p><div className="row"><a className="btn" href="#/profile">Create profile</a><button className="btn ghost" onClick={load}>Use Demo Profile</button></div></>;
 const d=Math.floor((now-t0)/1000),tm=Math.floor(d/60)+':'+String(d%60).padStart(2,'0'),hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),add=x=>setNotes(n=>[...n,[Date.now(),x]]);
 const getLoc=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setLoc(`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`);add('Location shared')},()=>say('Location unavailable'),{timeout:8000}):say('Location unavailable');
 const msg=`EMERGENCY: ${prof.name} may need help. Blood ${prof.blood||'unknown'}. Allergies: ${prof.allergies||'unknown'}. Conditions: ${prof.conditions||'unknown'}.${loc?' Location: '+loc:''}`;
 const R=[['PATIENT',prof.name],['BLOOD',prof.blood||'Unknown'],['ALLERGY ⚠️',prof.allergies||'Unknown'],['CONDITION',prof.conditions||'Unknown'],['MEDICATION',prof.meds||'Unknown'],['CONTACT',(prof.cName||'-')+(prof.cPhone?' · '+prof.cPhone:'')]];
 return <A k="curtain" className="sos"><div className="sh"><i/>EMERGENCY MODE ACTIVE<span style={{marginLeft:'auto'}}>{tm}</span></div>
 {R.map(([k,v],i)=><A key={k} k={i%2?'slide':'rise'} d={.3+i*.12} className="r"><b>{k}</b><span>{v}</span></A>)}
 <div className="g"><A k="zoom" t="a" d={1.1} className="btn red" href={tel(NUM)}>📞 CALL EMERGENCY SERVICES</A><A k="drop" t="button" d={1.2} className="btn green" onClick={getLoc}>📍 SHARE LOCATION</A><A k="flip" t="a" d={1.3} className="btn ghost" href={`sms:${String(prof.cPhone||'').replace(/[^\d+]/g,'')}?&body=${encodeURIComponent(msg)}`} onClick={()=>add('Alerted '+prof.cName)}>💬 ALERT CONTACT</A><A k="rot3d" t="a" d={1.4} className="btn ghost" href="#/help">🎙️ DESCRIBE WHAT HAPPENED</A></div>
 <div className="pd"><div className="small">TIMELINE</div><ul className="tl">{notes.map((n,i)=><A k="slide" t="li" key={i}><b>{hm(n[0])}</b> {n[1]}</A>)}</ul><div className="row"><input value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&nt.trim()){add(nt.trim());setNt('')}}} placeholder="Add an observation" aria-label="Add an observation" style={{flex:1,minWidth:150}}/><button className="btn ghost" onClick={()=>{if(nt.trim()){add(nt.trim());setNt('')}}}>Add</button></div></div></A>}

function Intro({done}){
 const[out,setOut]=useState(false),end=()=>{setOut(true);setTimeout(done,1000)};useEffect(()=>{const t=setTimeout(end,4300);return()=>clearTimeout(t)},[]);
 return <div id="intro" className={out?'out':''} aria-hidden="true">
  <div className="is s1"><svg className="ie" viewBox="0 0 1000 200"><path pathLength="1" d="M0 100H300L318 100 330 80 342 100H372L386 110 400 14 416 176 432 100H470L492 74 516 100H1000"/></svg><p className="it" style={{animationDelay:'1s'}}>When you can't speak,</p><p className="it t2" style={{animationDelay:'1.5s'}}>let your information speak.</p></div>
  <div className="is s2"><div className="ih"><HeartLogo w={76}/></div><div className="iw"><Letters text="CAREBRIDGE" from={-2}/></div><p className="isub">Emergency Information Bridge</p></div>
  <i className="ibar"/><button id="skip" onClick={end}>Skip intro</button></div>}
const Toast=()=>{const[m,setM]=useState('');useEffect(()=>{let t;const f=e=>{setM(e.detail);clearTimeout(t);t=setTimeout(()=>setM(''),2400)};addEventListener('cbt',f);return()=>removeEventListener('cbt',f)},[]);return m?<div className="toast fx fx-pop" role="status" key={m}>{m}</div>:null};

function App(){
 const[intro,setIntro]=useState(()=>{try{if(sessionStorage.cb2||/^#\/(emergency|sos)/.test(location.hash)||matchMedia('(prefers-reduced-motion: reduce)').matches)return false;sessionStorage.cb2=1}catch(e){}return true});
 const[h,setH]=useState(location.hash||'#/'),[open,setOpen]=useState(false),[prof,setProf]=useState(()=>g('profile',null));
 useEffect(()=>{const f=()=>{setH(location.hash||'#/');setOpen(false);scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 useEffect(()=>{document.documentElement.style.overflow=intro?'hidden':''},[intro]);
 useEffect(()=>{const f=()=>{const e=document.documentElement,m=e.scrollHeight-e.clientHeight;document.getElementById('prog').style.transform=`scaleX(${m>0?e.scrollTop/m:0})`};addEventListener('scroll',f,{passive:true});return()=>removeEventListener('scroll',f)},[]);
 const save=p=>{sv('profile',p);setProf(p)},load=()=>{save(DEMO);say('Demo profile loaded')};
 const[path,q]=h.slice(1).split('?'),seg=path.split('/').filter(Boolean),r=seg[0]||'home';
 const page={home:<Home prof={prof} load={load}/>,profile:<Profile prof={prof} save={save}/>,qr:<QR prof={prof} load={load}/>,help:<Help/>,sos:<SOS prof={prof} load={load}/>,emergency:<Viewer id={decodeURIComponent(seg[1]||'')} d={q&&q.startsWith('d=')?q.slice(2):''}/>}[r]||<Home prof={prof} load={load}/>;
 const L=[['#/','Home','home','drop'],['#/profile','My Profile','profile','flip'],['#/qr','Emergency QR','qr','blur'],['#/help','Help Someone','help','rot3d']];
 return <>{intro&&<Intro done={()=>setIntro(false)}/>}
 <nav><div className="wrap"><A k="spin" t="a" className="logo" href="#/" aria-label="CareBridge home"><HeartLogo/><span>CAREBRIDGE<small>Emergency Information Bridge</small></span></A>
  <button id="burger" aria-label="Menu" aria-expanded={open} onClick={()=>setOpen(!open)}>☰</button>
  <div className={'links'+(open?' open':'')}>{L.map(([hr,t,k,f],i)=><A key={k} k={f} t="a" d={.15+i*.1} href={hr} className={r===k?'on':''}>{t}</A>)}<A k="shake" t="a" d={.8} className="sosb" href="#/sos">🚨 Emergency Help</A></div></div></nav>
 <main><div className="wrap" key={h.split('?')[0]}>{page}</div></main>
 <footer><div className="wrap"><A k="wipe" d={.4}><b>Privacy:</b> CareBridge is a prototype. Do not enter real sensitive medical information into the demo. It does not diagnose, treat, or replace professional care. In an emergency, call local emergency services.</A></div></footer><Toast/></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
